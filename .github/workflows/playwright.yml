name: Static API Catalog

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.node-version
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate catalog data
        run: pnpm run validate:static-catalog
      - name: Typecheck static source
        run: pnpm exec tsc -p tsconfig.build.json --noEmit
      - name: Check static source formatting
        run: >-
          pnpm exec biome check
          src/staticCatalog
          tests/static-catalog.spec.ts
          scripts/validate-static-catalog.mjs
          static-catalog.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run static browser tests
        run: pnpm test
      - name: Build static catalog
        run: pnpm run build:static-catalog
