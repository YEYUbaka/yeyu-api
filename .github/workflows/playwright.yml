name: Playwright Tests

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env
            - compose*.yml
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: frontend/.node-version
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Set up pnpm
      run: corepack enable && corepack prepare pnpm@10.28.2 --activate
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"
    - name: Configure temporary test environment
      shell: bash
      run: |
        set -euo pipefail
        ci_postgres_password="$(openssl rand -hex 32)"
        ci_secret_key="$(openssl rand -hex 32)"
        ci_superuser_password="$(openssl rand -hex 32)"
        printf '::add-mask::%s\n' "$ci_postgres_password"
        printf '::add-mask::%s\n' "$ci_secret_key"
        printf '::add-mask::%s\n' "$ci_superuser_password"
        {
          printf 'POSTGRES_PASSWORD=%s\n' "$ci_postgres_password"
          printf 'PROJECT_NAME=Yeyu API CI\n'
          printf 'SECRET_KEY=%s\n' "$ci_secret_key"
          printf 'FIRST_SUPERUSER=ci-admin@example.test\n'
          printf 'FIRST_SUPERUSER_PASSWORD=%s\n' "$ci_superuser_password"
          printf 'EMAILS_FROM_EMAIL=ci-admin@example.test\n'
          printf 'SMTP_HOST=localhost\n'
          printf 'SMTP_PORT=1025\n'
          printf 'SMTP_TLS=false\n'
          printf 'SMTP_USER=\n'
          printf 'SMTP_PASSWORD=\n'
          printf 'DOMAIN=localhost\n'
          printf 'DATABASE_URL=postgresql://postgres:%s@localhost:5432/app\n' "$ci_postgres_password"
          printf 'VITE_API_URL=http://localhost:8000\n'
          printf 'MAILPIT_HOST=http://localhost:8025\n'
          printf 'API_PUBLIC_URL=http://localhost:8000\n'
          printf 'REDIS_URL=redis://redis:6379/0\n'
          printf 'SENTRY_DSN=\n'
          printf 'CI=true\n'
        } >> "$GITHUB_ENV"
    - run: uv sync
      working-directory: backend
    - run: pnpm install --frozen-lockfile
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - run: docker compose build
    - run: docker compose down -v --remove-orphans
    - run: docker compose run --rm backend bash scripts/prestart.sh
    - name: Run Playwright tests
      run: docker compose run --rm playwright pnpm exec playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - run: docker compose down -v --remove-orphans
    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 1

  merge-playwright-reports:
    needs:
      - test-playwright
      - changes
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: frontend/.node-version
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Set up pnpm
      run: corepack enable && corepack prepare pnpm@10.28.2 --activate
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: frontend
    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: frontend/all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
    - name: Merge into HTML Report
      run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      working-directory: frontend
    - name: Upload HTML report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
