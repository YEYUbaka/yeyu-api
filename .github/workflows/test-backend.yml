name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
      - name: Configure temporary test environment
        shell: bash
        run: |
          set -euo pipefail
          ci_postgres_password="$(openssl rand -hex 32)"
          ci_secret_key="$(openssl rand -hex 32)"
          ci_superuser_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$ci_postgres_password"
          printf '::add-mask::%s\n' "$ci_secret_key"
          printf '::add-mask::%s\n' "$ci_superuser_password"
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$ci_postgres_password"
            printf 'PROJECT_NAME=Yeyu API CI\n'
            printf 'SECRET_KEY=%s\n' "$ci_secret_key"
            printf 'FIRST_SUPERUSER=ci-admin@example.com\n'
            printf 'FIRST_SUPERUSER_PASSWORD=%s\n' "$ci_superuser_password"
            printf 'EMAILS_FROM_EMAIL=ci-admin@example.com\n'
            printf 'SMTP_HOST=localhost\n'
            printf 'SMTP_PORT=1025\n'
            printf 'SMTP_TLS=false\n'
            printf 'SMTP_USER=\n'
            printf 'SMTP_PASSWORD=\n'
            printf 'DOMAIN=localhost\n'
            printf 'DATABASE_URL=postgresql://postgres:%s@localhost:5432/app\n' "$ci_postgres_password"
            printf 'VITE_API_URL=http://localhost:8000\n'
            printf 'MAILPIT_HOST=http://localhost:8025\n'
            printf 'API_PUBLIC_URL=http://localhost:8000\n'
            printf 'REDIS_URL=redis://localhost:6379/0\n'
            printf 'SENTRY_DSN=\n'
            printf 'CI=true\n'
          } >> "$GITHUB_ENV"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db redis mailpit
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
